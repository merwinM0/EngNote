<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>English Reading</title>
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/content.css" />
  <link rel="stylesheet" href="/css/sidebar.css" />
  <link rel="stylesheet" href="/css/modal.css" />
</head>
<body>
  <header class="topbar">
    <h1>English Reading——learn English,TMD stop looking at the Chinese.</h1>
    <div class="api-row">
      <label for="apiKey">DeepSeek API Key</label>
      <input
        id="apiKey"
        type="password"
        autocomplete="off"
        placeholder="sk-..."
        spellcheck="false"
      />
      <button id="saveKeyBtn" class="btn btn-primary">Save Key</button>
      <span class="hint">(Saved to browser cookie, auto-loaded next time)</span>
    </div>
  </header>

  <main>
    <div class="toolbar">
      <button id="pasteBtn" class="btn">📋 Paste</button>
      <button id="formatBtn" class="btn">✦ Format</button>
      <button id="translateBtn" class="btn btn-accent">✎ Translate</button>
      <button id="deleteBtn" class="btn">🗑 Delete Note</button>
      <button id="saveBtn" class="btn btn-primary">💾 Save</button>
      <button id="clearBtn" class="btn btn-danger">Clear</button>
      <span id="modeHint" class="mode-hint"></span>
    </div>

    <div class="layout">
      <section class="editor-card main-col">
        <div class="card-head">
          <span>English paragraph view (click a word to translate)</span>
          <button id="fontSizeBtn" class="btn btn-ghost" title="Font size: click to switch (S/M/L)">Aa · M</button>
        </div>
        <div id="content" class="content" data-placeholder="Click 'Paste' above to paste English text from the clipboard"></div>
      </section>

      <!-- Right sidebar: saved articles -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-head">
          <span>Saved</span>
          <button id="refreshListBtn" class="btn btn-ghost">↻ Refresh</button>
        </div>
        <ul id="entryList" class="entry-list"></ul>
      </aside>
    </div>

    <section id="statusBar" class="status-bar" hidden></section>
  </main>

  <!-- Save modal -->
  <div id="saveModal" class="modal-mask" hidden>
    <div class="modal">
      <h3>Save to Database</h3>
      <label for="saveTitle">Title (Chinese not allowed)</label>
      <input id="saveTitle" type="text" placeholder="Enter a title..." spellcheck="false" />
      <div class="modal-actions">
        <button id="confirmSaveBtn" class="btn btn-primary">Save</button>
        <button id="cancelSaveBtn" class="btn">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Delete article confirm modal -->
  <div id="deleteConfirmModal" class="modal-mask" hidden>
    <div class="modal">
      <h3>Delete Article</h3>
      <p class="modal-body">Are you sure you want to delete this saved article? This action cannot be undone.</p>
      <div class="modal-actions">
        <button id="confirmDeleteBtn" class="btn btn-danger">Delete</button>
        <button id="cancelDeleteBtn" class="btn">Cancel</button>
      </div>
    </div>
  </div>

  <script type="module" src="/dist/app.js"></script>
</body>
</html>
